name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src scripts
      - run: uv run pytest --cov=fidelitygate --cov-report=term-missing --cov-fail-under=85
      - run: uv run python scripts/build_benchmark.py --check
      - run: uv run fidelitygate compare --suite evals/suites/smoke.json --output artifacts/smoke
      - run: uv run fidelitygate compare --suite evals/suites/envmutationbench.json --output artifacts/envmutationbench
      - run: uv run fidelitygate compare --suite evals/suites/search-stress.json --output artifacts/search-stress
      - run: uv run fidelitygate compare --suite evals/suites/envmutationbench-holdout.json --output artifacts/holdout
